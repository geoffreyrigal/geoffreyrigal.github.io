# ============================================================
# dhcpd.conf — Serveur DHCP zone Clients
# Réseau     : 172.15.100.0/22  (255.255.252.0)
# Plage DHCP : 172.15.100.1 → 172.15.101.194  (m3=450 adresses)
# Passerelle : 172.15.103.254 (R_C)
# DNS        : 8.8.8.8
# ============================================================

default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 172.15.100.0 netmask 255.255.252.0 {
    range 172.15.100.1 172.15.101.194;
    option routers 172.15.103.254;
    option subnet-mask 255.255.252.0;
    option domain-name-servers 8.8.8.8;
    default-lease-time 600;
    max-lease-time 7200;
}
